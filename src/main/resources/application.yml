mp:
  messaging:
    # Avro
    connector:
      smallrye-kafka:
        schema:
          registry:
            url: "http://localhost:8084"
        apicurio:
          registry:
            url: "http://localhost:8084"
    outgoing:
      new-user-notif-topic-out:
        topic: "new-user-notif-topic"
    incoming:
      new-user-topic-in:
        auto:
          offset:
            reset: "earliest"
        topic: "new-user-topic"
        connector: "smallrye-kafka"
        # Confluent
        group:
          id: "group-new-user-notifiers"
        # Avro
        value:
          deserializer: "io.confluent.kafka.serializers.KafkaAvroDeserializer"
        specific:
          avro:
            reader: true

# Kafka
kafka:
  bootstrap:
    servers: localhost:9092
  # Confluent
  security:
    protocol: SASL_PLAINTEXT
  sasl:
    mechanism: PLAIN
    jaas:
      config: 'org.apache.kafka.common.security.plain.PlainLoginModule required username="ms-notifications" password="contrasena";'

quarkus:
  application:
    name: ms-notifications
    version: "1.0.0"
# ORM: (Helm)
  datasource:
    db-kind: postgresql
    username: pguser
    password: pgpass
    jdbc:
      url: jdbc:postgresql://localhost:5434/bdnotificaciones
#  Open APi
  smallrye-openapi:
    path: /q/openapi
    info-title: "${quarkus.application.name}"
    info-version: "${quarkus.application.version}"

# Swagger UI (Obligatorio)
  swagger-ui:
    always-include: true
### TELEMETRIA
# Para Tempo Grafana (Helm)
  otel:
    sdk:
      disabled: false
    service:
      name: "${quarkus.application.name}-${quarkus.application.version}"
    enabled: true
    traces:
#      exporter: "otlp"
    exporter:
      otlp:
        endpoint: http://localhost:4317

# Exponer metricas para Prometheus
  micrometer:
    export:
      prometheus:
        enabled: true
        path: /q/metrics
# Formato de logs
  log:
    console:
      format: "%d{yyyy-MM-dd HH:mm:ss,SSS} %-5p [%c.%M] (%t) [traceId=%X{traceId}, spanId=%X{spanId}] %s%e%n"

# Puerto
  http:
    port: 8082
    root-path: "/operations/ms-notifications"
    non-application-root-path: "/q"
# CORS
    cors:
      enabled: true
      origins: "*"
      methods: GET, POST, PUT, DELETE
      exposed-headers: Content-Disposition
      access-control-max-age: 24H
      access-control-allow-credentials: true

